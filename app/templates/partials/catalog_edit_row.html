<tr class="bg-blue-50/60 border-y-2 border-blue-200">
    <td class="px-2 py-3">
        <input type="text" name="brand" value="{{ product.brand }}" placeholder="Marka" class="w-full px-2 py-1.5 text-sm border border-blue-300 rounded focus:ring-2 focus:ring-blue-500 outline-none">
    </td>
    
    <td class="px-2 py-3">
        <select name="category_id" class="w-full px-2 py-1.5 text-sm border border-blue-300 rounded focus:ring-2 focus:ring-blue-500 outline-none">
            {% for cat in categories %}
            <option value="{{ cat.id }}" {% if cat.id == product.category_id %}selected{% endif %}>{{ cat.name }}</option>
            {% endfor %}
        </select>
    </td>
    
    <td class="px-2 py-3">
        <input type="text" name="technical_specs" value="{{ product.technical_specs }}" placeholder="Özellik" class="w-full px-2 py-1.5 text-sm border border-blue-300 rounded focus:ring-2 focus:ring-blue-500 outline-none">
    </td>
    
    <td class="px-2 py-3">
        <div class="flex items-center space-x-1 justify-end">
            <input type="text" name="unit_price" value="{{ '{:.2f}'.format(product.unit_price).replace('.', ',') }}" class="w-20 px-2 py-1.5 text-sm border border-blue-300 rounded text-right focus:ring-2 focus:ring-blue-500 outline-none">
            <span class="text-slate-500 text-sm">₺/</span>
            <select name="unit" class="w-20 px-1 py-1.5 text-sm border border-blue-300 rounded focus:ring-2 focus:ring-blue-500 outline-none">
                <option value="Adet" {% if product.unit == 'Adet' %}selected{% endif %}>Adet</option>
                <option value="Metre" {% if product.unit == 'Metre' %}selected{% endif %}>Metre</option>
                <option value="Kutu" {% if product.unit == 'Kutu' %}selected{% endif %}>Kutu</option>
            </select>
        </div>
    </td>
    
    <td class="px-2 py-3 text-center">
        <div class="flex justify-center space-x-2">
            <button hx-put="/catalog/product/{{ product.id }}" 
                    hx-include="closest tr" 
                    hx-target="closest tr" 
                    hx-swap="outerHTML" 
                    class="bg-emerald-500 hover:bg-emerald-600 text-white p-1.5 rounded shadow-sm transition" title="Kaydet">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            </button>
            
            <button hx-get="/catalog/product/{{ product.id }}" 
                    hx-target="closest tr" 
                    hx-swap="outerHTML" 
                    class="bg-slate-400 hover:bg-slate-500 text-white p-1.5 rounded shadow-sm transition" title="İptal">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
    </td>
</tr>
