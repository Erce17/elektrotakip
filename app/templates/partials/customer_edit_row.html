<tr class="bg-blue-50/60 border-y-2 border-blue-200">
    <td class="px-2 py-3">
        <input type="text" name="name" value="{{ customer.name }}" placeholder="Firma / Kişi Adı" class="w-full px-2 py-1.5 text-sm border border-blue-300 rounded focus:ring-2 focus:ring-blue-500 outline-none">
    </td>
    <td class="px-2 py-3">
        <input type="text" name="phone" value="{{ customer.phone or '' }}" placeholder="Telefon" class="w-full px-2 py-1.5 text-sm border border-blue-300 rounded focus:ring-2 focus:ring-blue-500 outline-none">
    </td>
    <td class="px-2 py-3">
        <input type="text" name="address" value="{{ customer.address or '' }}" placeholder="Adres" class="w-full px-2 py-1.5 text-sm border border-blue-300 rounded focus:ring-2 focus:ring-blue-500 outline-none">
    </td>
    <td class="px-2 py-3 text-center">
        <div class="flex justify-center space-x-2">
            <button hx-put="/customers/{{ customer.id }}"
                    hx-include="closest tr"
                    hx-target="closest tr"
                    hx-swap="outerHTML"
                    class="bg-emerald-500 hover:bg-emerald-600 text-white p-1.5 rounded shadow-sm transition" title="Kaydet">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            </button>
            <button hx-get="/customers/{{ customer.id }}/row"
                    hx-target="closest tr"
                    hx-swap="outerHTML"
                    class="bg-slate-400 hover:bg-slate-500 text-white p-1.5 rounded shadow-sm transition" title="İptal">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
    </td>
</tr>
