{% for product in products %}
<tr class="hover:bg-slate-50 transition">
    <td class="px-6 py-4 font-medium text-slate-800">{{ product.brand or '-' }}</td>
    <td class="px-6 py-4">
        <span class="bg-blue-50 text-blue-700 px-2 py-1 rounded text-xs font-medium">
            {{ product.category.name if product.category else '-' }}
        </span>
    </td>
    <td class="px-6 py-4 text-slate-500 text-sm">{{ product.technical_specs or '-' }}</td>
    <td class="px-6 py-4 font-semibold text-slate-700 text-right whitespace-nowrap">
        {{ product.unit_price | fiyat }} ₺ / {{ product.unit or 'Adet' }}
    </td>
    <td class="px-6 py-4 text-center flex justify-center space-x-2">
        <button hx-get="/catalog/product/{{ product.id }}/edit" 
                hx-target="closest tr" 
                hx-swap="outerHTML"
                class="text-slate-400 hover:text-blue-600 transition p-1 rounded hover:bg-blue-50"
                title="Düzenle">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
        </button>
        
        <button hx-delete="/catalog/product/{{ product.id }}" 
                hx-target="closest tr" 
                hx-swap="outerHTML" 
                hx-confirm="Bu malzemeyi silmek istediğinize emin misiniz?"
                class="text-slate-400 hover:text-red-600 transition p-1 rounded hover:bg-red-50"
                title="Sil">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
        </button>
    </td>
</tr>
{% else %}
<tr>
    <td colspan="5" class="px-6 py-8 text-center text-slate-400">
        Malzeme bulunamadı.
    </td>
</tr>
{% endfor %}
